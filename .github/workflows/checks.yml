name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: |
          sudo apt-get update -q
          # clang/lld 18.1.3: the version prebuilt/camera.oemlayer.wrap.so is built with
          sudo apt-get install -yq dash clang-18 lld-18
          sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang
          sudo ln -sf /usr/bin/ld.lld-18 /usr/local/bin/ld.lld
          pip install -q black ruff

      - name: Python format and lint
        run: |
          black --check tools tests
          ruff check tools tests

      - name: Shell syntax
        run: for f in module/*.sh tools/oemwrap/build.sh tests/*.sh; do dash -n "$f"; done

      - name: Tests
        run: |
          dash tests/test_common.sh
          python -m unittest discover -s tests -v
